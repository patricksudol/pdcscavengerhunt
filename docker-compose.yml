services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pdcscavengerhunt
      POSTGRES_USER: pdc
      POSTGRES_PASSWORD: pdc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdc -d pdcscavengerhunt"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        python -m pdcscavengerhunt.seed &&
        exec sanic pdcscavengerhunt.app:app --host=0.0.0.0 --port=8000 --workers=1
    ports:
      - "127.0.0.1:${PDC_PORT:-8000}:8000"
    environment:
      PDC_ENVIRONMENT: development
      PDC_DATABASE_URL: postgresql+psycopg://pdc:pdc@db:5432/pdcscavengerhunt
      PDC_PUBLIC_BASE_URL: ${PDC_PUBLIC_BASE_URL:-http://localhost:8000}
      PDC_SESSION_SECRET: ${PDC_SESSION_SECRET:-local-compose-session-secret-change-in-production}
      PDC_CLUE_CODE_SECRET: ${PDC_CLUE_CODE_SECRET:-local-compose-clue-secret-change-in-production}
      PDC_SEED_ADMIN_USERNAME: ${PDC_SEED_ADMIN_USERNAME:-admin}
      PDC_SEED_ADMIN_PASSWORD: ${PDC_SEED_ADMIN_PASSWORD:-demo-scavenger-2026}
      PDC_SEED_ADMIN_NAME: ${PDC_SEED_ADMIN_NAME:-Game Administrator}
      PDC_SECURE_COOKIES: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
