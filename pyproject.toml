[project]
name = "pdcscavengerhunt"
version = "0.1.0"
description = "A sequential scavenger hunt game for the Phoenixville Democratic Committee"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16",
  "email-validator>=2.2",
  "greenlet>=3.2",
  "itsdangerous>=2.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "psycopg[binary]>=3.2",
  "sanic>=25.12,<26",
  "sqlalchemy[asyncio]>=2.0.41",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21",
  "coverage[toml]>=7.9",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
  "sanic-testing>=24.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdcscavengerhunt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
source = ["pdcscavengerhunt"]
branch = true
