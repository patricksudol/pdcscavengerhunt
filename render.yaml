services:
  - type: web
    name: pdcscavengerhunt
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/ready
    preDeployCommand: alembic upgrade head
    initialDeployHook: python -m pdcscavengerhunt.seed
    envVars:
      - key: PDC_ENVIRONMENT
        value: production
      - key: PDC_DATABASE_URL
        fromDatabase:
          name: pdcscavengerhunt-db
          property: connectionString
      - key: PDC_PUBLIC_BASE_URL
        sync: false
      - key: PDC_SESSION_SECRET
        generateValue: true
      - key: PDC_CLUE_CODE_SECRET
        generateValue: true
      - key: PDC_SECURE_COOKIES
        value: "true"
      - key: PDC_SEED_ADMIN_USERNAME
        sync: false
      - key: PDC_SEED_ADMIN_PASSWORD
        sync: false
      - key: PDC_SEED_ADMIN_NAME
        sync: false

databases:
  - name: pdcscavengerhunt-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "17"
    databaseName: pdcscavengerhunt
    user: pdc
    diskSizeGB: 1
    storageAutoscalingEnabled: true
    ipAllowList: []
